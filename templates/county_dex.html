<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: Georgia, "Times New Roman", serif; }

  /* Certificate frame: heavy outer rule, hairline inner rule, aged card stock. */
  .container {
    width: 1584px;
    background: #211E1A;
    border: 4px solid #C9A85C;
    padding: 10px;
    color: #E5DDCA;
  }
  .plate {
    border: 1px solid #8A7440;
    padding: 40px 48px 44px 48px;
    background:
      radial-gradient(ellipse at center, rgba(33,30,26,0) 55%, rgba(0,0,0,0.35) 100%);
  }

  .masthead { display: flex; justify-content: space-between; align-items: flex-start; }
  .dexname {
    font-size: 58px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .ownerline {
    font-size: 26px; font-style: italic; color: #A79B7F; margin-top: 8px;
  }
  .ownerline em { font-style: italic; font-weight: 700; color: #E5DDCA; }

  /* The collector's stamp: sealing-wax red, set slightly askew. */
  .stamp {
    border: 4px double #C4453A; color: #C4453A;
    padding: 10px 22px 8px 22px; text-align: center;
    transform: rotate(-4deg); margin-top: 6px; margin-right: 8px;
    opacity: 0.92;
  }
  .stamp-count { font-size: 40px; font-weight: 700; letter-spacing: 0.08em; }
  .stamp-word {
    font-size: 17px; text-transform: uppercase; letter-spacing: 0.3em; margin-top: 2px;
  }

  /* Printed key, as on a map plate. */
  .keyline {
    display: flex; align-items: center; gap: 24px;
    border-top: 1px solid #8A7440; border-bottom: 1px solid #8A7440;
    margin-top: 26px; margin-bottom: 26px; padding: 10px 2px;
  }
  .keylabel {
    font-size: 19px; text-transform: uppercase; letter-spacing: 0.22em; color: #A79B7F;
  }
  .chip { display: flex; align-items: center; gap: 9px; font-size: 20px; }
  .swatch { width: 15px; height: 15px; border: 1px solid #E5DDCA; }
  .swatch.legendary { background: #D4A93C; }
  .swatch.epic { background: #9B6FD0; }
  .swatch.rare { background: #5B8FD6; }
  .swatch.uncommon { background: #5FA76A; }
  .swatch.common { background: #7E786C; }

  .grid { display: flex; flex-wrap: wrap; gap: 11px; }

  /* Album slots: engraved double line, square corners, tier ink on the outer rule. */
  .cell {
    width: 135px; height: 128px;
    border: 2px solid #7E786C;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5);
    background: rgba(0,0,0,0.22);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .cell.legendary { border-color: #D4A93C; }
  .cell.epic { border-color: #9B6FD0; }
  .cell.rare { border-color: #5B8FD6; }
  .cell.uncommon { border-color: #5FA76A; }
  .cell.common { border-color: #7E786C; }
  .cell.legendary.owned { background: rgba(212,169,60,0.14); }
  .cell img { width: 102px; height: 102px; object-fit: contain; display: block; }

  /* An empty slot: the specimen printed as a faint ink impression, rule faded. */
  .cell.missing img { filter: brightness(0) invert(1); opacity: 0.14; }
  .cell.missing.legendary { border-color: rgba(212,169,60,0.45); }
  .cell.missing.epic { border-color: rgba(155,111,208,0.45); }
  .cell.missing.rare { border-color: rgba(91,143,214,0.45); }
  .cell.missing.uncommon { border-color: rgba(95,167,106,0.45); }
  .cell.missing.common { border-color: rgba(126,120,108,0.5); }

  /* Duplicate tally, inked over the slot corner. */
  .badge {
    position: absolute; top: -9px; right: -9px;
    background: #211E1A; border: 1px solid #C9A85C; color: #E5DDCA;
    font-size: 15px; font-weight: 700; padding: 0 6px;
  }

</style>
</head>
<body>
  <div class="container">
    <div class="plate">
      <div class="masthead">
        <div>
          <div class="dexname">The County Dex</div>
          <div class="ownerline">collected by <em>{{ OWNER }}</em> · a series of ninety-two · {{ PCT }} of the realm</div>
        </div>
        <div class="stamp">
          <div class="stamp-count">{{ COMPLETION }}</div>
          <div class="stamp-word">Collected</div>
        </div>
      </div>
      <div class="keyline">
        <span class="keylabel">Key to rarities</span>
        <div class="chip"><div class="swatch legendary"></div>Legendary</div>
        <div class="chip"><div class="swatch epic"></div>Epic</div>
        <div class="chip"><div class="swatch rare"></div>Rare</div>
        <div class="chip"><div class="swatch uncommon"></div>Uncommon</div>
        <div class="chip"><div class="swatch common"></div>Common</div>
      </div>
      {{ SECTIONS }}
    </div>
  </div>
</body>
</html>
