<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .container {
    width: 940px;
    background: linear-gradient(160deg, #1c2027 0%, #14171c 100%);
    border-radius: 24px;
    padding: 36px 40px 30px 40px;
    color: #e8eaee;
  }
  .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .title { font-size: 40px; font-weight: 800; }
  .completion { font-size: 34px; font-weight: 800; color: #f5c542; }
  .subtitle { font-size: 20px; color: #9aa1ad; margin-bottom: 18px; }
  .legend { display: flex; gap: 22px; margin-bottom: 22px; }
  .legend .chip { display: flex; align-items: center; gap: 8px; font-size: 17px; color: #c6cbd4; font-weight: 600; }
  .dot { width: 16px; height: 16px; border-radius: 50%; }
  .dot.legendary { background: #f5c542; }
  .dot.epic { background: #a55eea; }
  .dot.rare { background: #4f8ff7; }
  .dot.uncommon { background: #57b96b; }
  .dot.common { background: #8a8f98; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .cell {
    width: 135px;
    background: #232830;
    border-radius: 16px;
    border: 3px solid #3a4048;
    padding: 12px 5px;
    text-align: center;
    position: relative;
  }
  .cell.legendary { border-color: #f5c542; }
  .cell.epic { border-color: #a55eea; }
  .cell.rare { border-color: #4f8ff7; }
  .cell.uncommon { border-color: #57b96b; }
  .cell.common { border-color: #565b63; }
  .cell img { width: 100px; height: 100px; object-fit: contain; display: block; margin: 0 auto; }
  .cell.missing img { filter: brightness(0) invert(0.28); opacity: 0.75; }
  .cell.legendary.owned { background: #2e2917; }
  .badge {
    position: absolute; top: -10px; right: -8px;
    background: #f5c542; color: #1b1e24;
    font-size: 15px; font-weight: 800;
    border-radius: 11px; padding: 1px 8px;
  }
  .footer { margin-top: 6px; font-size: 15px; color: #767d89; text-align: right; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">{{ TITLE }}</div>
      <div class="completion">{{ COMPLETION }}</div>
    </div>
    <div class="subtitle">{{ SUBTITLE }}</div>
    <div class="legend">
      <div class="chip"><div class="dot legendary"></div>Legendary</div>
      <div class="chip"><div class="dot epic"></div>Epic</div>
      <div class="chip"><div class="dot rare"></div>Rare</div>
      <div class="chip"><div class="dot uncommon"></div>Uncommon</div>
      <div class="chip"><div class="dot common"></div>Common</div>
    </div>
    {{ SECTIONS }}
    <div class="footer">HMS Victory County Balls</div>
  </div>
</body>
</html>
