<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HMS Victory - Rank Card</title>
<style>
  /* Rank card (1000x600, the size the purchasable backgrounds are made for).
     The background fills the top banner; the seam under it is the peerage progress bar.
     lib/features/rank_card.py fills the tokens and injects the body. */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Outfit:wght@700;800&family=Noto+Sans+Math&family=Noto+Sans+Symbols+2&family=Noto+Color+Emoji&display=swap');

  :root {
    --primary: {{primary}};
    --secondary: {{secondary}};
    --tertiary: {{tertiary}};
    --cell: {{cell}}px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #111214; }
  body { font-family: 'Inter', 'Noto Sans Math', 'Noto Sans Symbols 2', 'Noto Color Emoji', sans-serif; color: #F2F3F5; -webkit-font-smoothing: antialiased; }
  .num { font-family: 'Outfit', 'Inter', sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .card { position: relative; width: 1000px; height: 600px; overflow: hidden; background: #111214; display: flex; flex-direction: column; }

  /* Banner: the member's background, untouched apart from a soft fade into the seam. */
  .banner { height: 340px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 24px 14px; background-size: cover; background-position: center; }
  .banner-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .banner-row.bottom { align-items: flex-end; padding-left: 220px; }
  .chip { padding: 8px 14px; border-radius: 6px; background: rgba(17,18,20,0.85); }
  .rank-chip { font-size: 26px; color: #F0B232; }
  .coins { display: flex; gap: 8px; }
  .coin { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
  .coin img { width: 24px; height: 24px; }
  .coin span { font-size: 21px; }
  .tier { padding: 6px 12px; font-size: 17px; font-weight: 700; }
  .tier.current { color: #8C95FF; }
  .tier.next { color: #3BD47A; }
  .tier.max { color: #F0B232; }

  /* Seam = peerage progress, coloured with the member's chosen palette. */
  .seam { height: 16px; flex-shrink: 0; background: #2B2D31; display: flex; }
  .seam div { height: 16px; background: linear-gradient(90deg, var(--primary), var(--tertiary), var(--secondary)); }

  .avatar-ring { position: absolute; left: 36px; top: 256px; width: 184px; height: 184px; border-radius: 50%; background: conic-gradient(var(--primary), var(--tertiary), var(--secondary), var(--tertiary), var(--primary)); display: flex; align-items: center; justify-content: center; }
  .avatar-ring img { width: 172px; height: 172px; border-radius: 50%; border: 6px solid #111214; object-fit: cover; background: #2B2D31; }

  .lower { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px 36px 24px; }
  .name-row { padding-left: 208px; display: flex; align-items: center; gap: 14px; min-width: 0; }
  .name { min-width: 0; font-family: 'Outfit', 'Noto Sans Math', 'Noto Sans Symbols 2', 'Noto Color Emoji', sans-serif; font-weight: 800; line-height: 1.15; }
  .title-chip { flex-shrink: 0; max-width: 320px; padding: 4px 12px; border-radius: 4px; background: rgba(212,166,74,0.16); font-size: 16px; font-weight: 700; color: #E5C27A; }
  .subline { padding-left: 208px; font-size: 18px; font-weight: 600; color: #B5BAC1; }
  .spacer { flex: 1; }

  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { width: var(--cell); height: var(--cell); border-radius: 6px; border: 2px solid; display: flex; align-items: center; justify-content: center; }
  .badge img { width: 68%; height: 68%; object-fit: contain; }
  .badge.gold { border-color: #FFD700; background: rgba(255,215,0,0.12); }
  .badge.silver { border-color: #C0C6CF; background: rgba(192,198,207,0.12); }
  .badge.bronze { border-color: #C98B4E; background: rgba(201,139,78,0.12); }
  .badge.secret { border: none; padding: 3px; background: conic-gradient(#F23F43, #F0B232, #23A55A, #00A8FC, #5865F2, #EB459E, #F23F43); }
  .badge.secret div { width: 100%; height: 100%; border-radius: 4px; background: #111214; display: flex; align-items: center; justify-content: center; }
  .badge.secret img { width: 72%; height: 72%; }
</style>
</head>
<body>
{{body}}
</body>
</html>
